name: Deploy to production

# 触发方式：push 到 main，或在 GitHub 页面 Actions → Deploy to production → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 认证方式：优先密码，其次密钥 ----------
      - name: Prepare SSH auth
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          HOST="${{ secrets.DEPLOY_HOST }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$DEPLOY_PASSWORD" ]; then
            echo "::notice::使用密码认证"
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_AUTH=password" >> $GITHUB_ENV
            echo "DEPLOY_PASSWORD=$DEPLOY_PASSWORD" >> $GITHUB_ENV
          elif [ -n "$DEPLOY_KEY" ]; then
            echo "::notice::使用密钥认证"
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "SSH_AUTH=key" >> $GITHUB_ENV
          else
            echo "::error::缺少 DEPLOY_PASSWORD 或 DEPLOY_KEY secret"
            exit 1
          fi

      # ---------- 统一执行入口 ----------
      - name: Upload source and rebuild on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:?DEPLOY_HOST missing}"
          USER="${DEPLOY_USER:-root}"
          APP_DIR="${DEPLOY_PATH:-/app}"

          if [ "${SSH_AUTH}" = "password" ]; then
            SSHP="sshpass -p ${DEPLOY_PASSWORD} ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          else
            SSHP="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=20"
          fi

          echo "===== 1) 上传源码（不动 .env / certs / order-files / .git / node_modules / .next）====="
          tar --exclude='./node_modules' \
              --exclude='./.next' \
              --exclude='./.git' \
              --exclude='./order-files' \
              --exclude='./certs' \
              --exclude='./.env' \
              --exclude='./.env.*' \
              --exclude='./.trae' \
              --exclude='./.vscode' \
              --exclude='*.log' \
              -czf - . | $SSHP "$USER@$HOST" "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'"

          echo "===== 2) 停服务 + 清构建缓存 ====="
          $SSHP "$USER@$HOST" "cd '$APP_DIR' && docker compose --env-file .env.production down --remove-orphans || true; docker builder prune -f || true; docker image prune -f || true; df -h /"

          echo "===== 3) 覆盖式重建 ====="
          $SSHP "$USER@$HOST" "cd '$APP_DIR' && docker compose --env-file .env.production up -d --build"

          echo "===== 4) 容器状态 ====="
          $SSHP "$USER@$HOST" "cd '$APP_DIR' && docker compose ps"

      - name: Verify HTTP 200
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "http://${DEPLOY_HOST}/" || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::站点 4 分钟内未返回 200"
          exit 1
