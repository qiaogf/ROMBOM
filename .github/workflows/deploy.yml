name: Deploy to production

# 触发方式：push 到 main，或在 GitHub 页面 Actions → Deploy to production → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 仅改动 .github/ 的提交（如新增运维工作流）不触发重建
      - name: Detect deployable changes
        id: changes
        run: |
          set -e
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=""
          fi
          echo "changed files:"; echo "$CHANGED"
          if [ -n "$CHANGED" ] && [ -z "$(echo "$CHANGED" | grep -v '^\.github/')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::本次仅 .github/ 变更，跳过部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 认证方式：优先密码，其次密钥 ----------
      - name: Prepare SSH auth
        if: steps.changes.outputs.skip != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          HOST="${{ secrets.DEPLOY_HOST }}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$DEPLOY_PASSWORD" ]; then
            echo "::notice::使用密码认证"
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_AUTH=password" >> $GITHUB_ENV
            echo "DEPLOY_PASSWORD=$DEPLOY_PASSWORD" >> $GITHUB_ENV
          elif [ -n "$DEPLOY_KEY" ]; then
            echo "::notice::使用密钥认证"
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "SSH_AUTH=key" >> $GITHUB_ENV
          else
            echo "::error::缺少 DEPLOY_PASSWORD 或 DEPLOY_KEY secret"
            exit 1
          fi

      # ---------- 统一执行入口 ----------
      - name: Upload source and rebuild on server
        if: steps.changes.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          HOST="${DEPLOY_HOST:?DEPLOY_HOST missing}"
          USER="${DEPLOY_USER:-root}"
          APP_DIR="${DEPLOY_PATH:-/app}"
          LOG="/tmp/deploy.log"
          : > "$LOG"

          run_remote() {
            if [ "${SSH_AUTH}" = "password" ]; then
              sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$USER@$HOST" "$@"
            else
              ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$USER@$HOST" "$@"
            fi
          }

          fail() {
            echo "===== 部署失败，日志尾部 ====="
            tail -n 80 "$LOG" || true
            MSG=$(tail -n 80 "$LOG" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-6000)
            echo "::error title=Deploy failed::$MSG"
            exit 1
          }

          echo "===== 0) 连通性与环境自检 ====="
          run_remote "echo CONNECTED \$(hostname); docker --version; docker compose version; df -h / | tail -1; free -m | head -2" 2>&1 | tee -a "$LOG" || fail

          echo "===== 1) 上传源码（不动 .env / certs / order-files / .git / node_modules / .next）====="
          tar --exclude='./node_modules' \
              --exclude='./.next' \
              --exclude='./.git' \
              --exclude='./order-files' \
              --exclude='./certs' \
              --exclude='./.env' \
              --exclude='./.env.*' \
              --exclude='./.trae' \
              --exclude='./.vscode' \
              --exclude='*~root*' \
              --exclude='*.log' \
              -czf - . | run_remote "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'" 2>&1 | tee -a "$LOG" || fail

          echo "===== 2) 清理构建缓存（不清运行中的容器）====="
          run_remote "docker builder prune -f; docker image prune -f; df -h /" 2>&1 | tee -a "$LOG" || true

          echo "===== 3) 构建镜像（保留旧容器，构建失败不影响线上）====="
          if ! run_remote "cd '$APP_DIR' && bash -s" <<'REMOTE' 2>&1 | tee -a "$LOG"
          set -e
          echo "--- env 检查 ---"
          grep -q '^DATABASE_URL=' .env.production && echo "DATABASE_URL present"
          grep -q '^DOMAIN=' .env.production && echo "DOMAIN present"
          echo "--- disk before ---"; df -h / | tail -2; free -m | head -2
          echo "--- docker compose build ---"
          docker compose --env-file .env.production build --progress=plain
          REMOTE
          then
            echo "===== 构建失败，收集现场 =====" | tee -a "$LOG"
            run_remote "cd '$APP_DIR' && (docker compose --env-file .env.production logs --no-color --tail=100 app || true); echo '--- dmesg ---'; dmesg 2>/dev/null | tail -15 || true; echo '--- mem ---'; free -m; echo '--- disk ---'; df -h /" 2>&1 | tee -a "$LOG" || true
            fail
          fi

          echo "===== 4) 切换容器 ====="
          run_remote "cd '$APP_DIR' && docker compose --env-file .env.production up -d --remove-orphans && sleep 5 && docker compose ps" 2>&1 | tee -a "$LOG" || fail

      - name: Verify HTTP 200
        if: steps.changes.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${DEPLOY_HOST}/" || echo 000)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error title=Health check failed::站点 5 分钟内未返回 200，请查看上一步日志尾部"
          exit 1
