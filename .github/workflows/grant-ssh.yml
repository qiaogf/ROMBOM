name: Grant SSH access

# 用途：在无法登录服务器控制台时，复用部署凭据（DEPLOY_USER/DEPLOY_PASSWORD）
# 把指定公钥追加到服务器 root 的 authorized_keys，从而恢复直接 SSH 访问。
# 触发：GitHub 页面 Actions → Grant SSH access → Run workflow
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "要授权的公钥（留默认值即可）"
        required: false
        default: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHwNmy3pq9AnNF70OL3+41eOLTgvwoM6OAUpSDJ1vY9a mrobom"

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorize key on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          set +e
          HOST="${DEPLOY_HOST:?DEPLOY_HOST missing}"
          USER="${DEPLOY_USER:-root}"
          echo "HOST=$HOST USER=$USER"
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          command -v sshpass >/dev/null || { echo "::error title=sshpass 安装失败::runner 无法安装 sshpass"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          [ -n "$PUBKEY" ] || { echo "::error::pubkey 为空"; exit 1; }
          PWB64=$(printf '%s' "$DEPLOY_PASSWORD" | base64 -w0)

          OUT=$(sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
                -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
                -o NumberOfPasswordPrompts=1 "$USER@$HOST" "PWB64='$PWB64' bash -s" <<REMOTE 2>&1
          set -e
          echo "WHOAMI=\$(whoami)"
          echo "HOME=\$HOME"
          echo "USER_B64=\$(printf '%s' "\$(whoami)" | base64 -w0)"
          # 1) 授权当前登录用户（非 root，在 docker 组里，足够查镜像）
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if grep -qxF '$PUBKEY' ~/.ssh/authorized_keys 2>/dev/null; then
            echo "USER_KEY=PRESENT"
          else
            printf '%s\n' '$PUBKEY' >> ~/.ssh/authorized_keys
            echo "USER_KEY=APPENDED"
          fi
          chmod 600 ~/.ssh/authorized_keys
          echo "USER_AUTH_KEYS=\$(wc -l < ~/.ssh/authorized_keys)"
          # 2) 尽力给 root 也授权（依赖 sudo）
          PASSWORD=\$(printf '%s' "\$PWB64" | base64 -d 2>/dev/null || true)
          TMP=\$(mktemp)
          printf '%s\n' '$PUBKEY' > "\$TMP"
          if [ -n "\$PASSWORD" ] && echo "\$PASSWORD" | sudo -S -p '' true 2>/dev/null; then
            if echo "\$PASSWORD" | sudo -S -p '' sh -c "mkdir -p /root/.ssh && chmod 700 /root/.ssh; grep -qxF '$PUBKEY' /root/.ssh/authorized_keys 2>/dev/null || cat '\$TMP' >> /root/.ssh/authorized_keys; chmod 600 /root/.ssh/authorized_keys" >/dev/null 2>&1; then
              echo "ROOT_KEY=DONE"
            else
              echo "ROOT_KEY=WRITE_FAIL"
            fi
          else
            echo "ROOT_KEY=SKIPPED"
          fi
          rm -f "\$TMP"
          echo "SSHD_ROOT=\$(grep -Ei '^PermitRootLogin' /etc/ssh/sshd_config || echo default)"
          REMOTE
          )
          RC=$?
          echo "RC=$RC"
          echo "---- OUTPUT ----"
          echo "$OUT"
          MSG=$(echo "$OUT" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3000)
          if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q 'USER_KEY=APPENDED\|USER_KEY=PRESENT'; then
            echo "::notice title=SSH 公钥已就绪 (RC=$RC)::$MSG"
            exit 0
          else
            echo "::error title=公钥写入失败 (RC=$RC)::$MSG"
            exit 1
          fi
