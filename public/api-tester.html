<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API Query & Export Excel</title>
<!-- xlsx CDN for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!--
  Cross-border API endpoint tester + Excel exporter.
  Single-file native JS — no build, no framework. Open via file:// double-click.
  Endpoint: GET {server}/api/model-prices
    Header: x-api-key: {account API key}
    Query:  ?model=&limit=&offset=
    Response (success): { success: true, total, limit, offset, rows: [{ brand, model, price, condition, leadTime }] }
    Response (error):   { success: false, error: "..." }
  CORS configured for file:// origin (ACAO: * / ACAH: x-api-key, Content-Type).
-->
<style>
  /* 统一 border-box：width:100% 包含 padding+border，输入框不再右溢 */
  *, *::before, *::after { box-sizing: border-box; }

  /* === Layout参考: 上传的 api-tester.html === */
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, Arial, sans-serif;
    max-width: 1100px;
    margin: 16px auto;
    padding: 16px;
    background: #f8f9fa;
    color: #333;
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: #666; font-size: 13px; margin: 0 0 8px; }

  /* Box */
  .box {
    background: #fff;
    border: 1px solid #e0e0e0;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
  }
  .box h3 { margin: 4px 0 6px; padding-top: 4px; border-top: 1px solid #eee; font-size: 14px; font-weight: 600; }

  /* Form */
  .field-row {
    display: flex;
    align-items: center;
    margin: 3px 0;
    flex-wrap: wrap;
  }
  label {
    display: inline-block;
    width: 120px;
    font-size: 13px;
    color: #333;
    flex-shrink: 0;
  }
  input[type="text"], input[type="password"], input[type="number"] {
    padding: 5px;
    margin: 2px;
    font-size: 13px;
    flex: 1;
    min-width: 200px;
    max-width: 480px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
  }
  input:focus {
    outline: none;
    border-color: #0070f3;
    box-shadow: 0 0 0 2px rgba(0,112,243,0.15);
  }
  input::placeholder { color: #aaa; }

  /* API key show/hide toggle inside input */
  .input-wrap { position: relative; flex: 1; max-width: 480px; min-width: 200px; margin: 2px; }
  .input-wrap input[type="text"],
  .input-wrap input[type="password"] {
    width: 100%;
    margin: 0;
    padding-right: 44px;
  }
  .eye-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 11px;
    color: #999;
    user-select: none;
    padding: 2px 4px;
    line-height: 1;
  }
  .eye-toggle:hover { color: #333; }

  /* Buttons */
  button {
    padding: 6px 16px;
    margin: 3px;
    font-size: 13px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: background 120ms ease, opacity 120ms ease;
  }
  .btn-query  { background: #0070f3; color: #fff; }
  .btn-query:hover:not(:disabled)  { background: #0051cc; }
  .btn-export { background: #16a34a; color: #fff; }
  .btn-export:hover:not(:disabled) { background: #15803d; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .actions { margin-top: 6px; }

  /* Status */
  #status {
    color: #666;
    font-size: 12px;
    margin: 4px 0;
    padding: 5px 8px;
    background: #f8f9fa;
    border-radius: 4px;
    min-height: 16px;
  }
  #status b { color: #333; font-weight: 600; }
  #status:empty, #alertArea:empty { display: none; }

  /* Alert */
  .alert {
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    margin: 4px 0;
    line-height: 1.3;
  }
  .alert b { font-weight: 600; }
  .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
  .alert-error   { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .alert-warn    { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 5px 8px;
    text-align: left;
  }
  th {
    background: #f1f3f5;
    font-weight: 600;
    text-align: left;
  }
  tbody tr:hover td { background: #f8f9fa; }
  td.price { font-weight: 600; }
  .empty-row { text-align: center; color: #999; }
  .tip { color: #888; font-size: 12px; margin-top: 4px; }

  /* Footer */
  .footer {
    color: #888;
    font-size: 11px;
    margin-top: 10px;
    text-align: center;
  }
  .footer code {
    background: #f1f3f5;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    color: #555;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 600ms linear infinite;
    vertical-align: -2px;
    margin-right: 5px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile responsive */
  @media (max-width: 640px) {
    body { padding: 10px; margin: 10px auto; }
    .box { padding: 10px; }
    label { width: 100%; margin-bottom: 3px; }
    input[type="text"], input[type="password"], input[type="number"] {
      max-width: 100%;
      margin: 0 0 5px 0;
    }
    .field-row { flex-direction: column; align-items: stretch; }
    .input-wrap { max-width: 100%; min-width: 0; margin: 0 0 5px 0; }
    .input-wrap input[type="text"],
    .input-wrap input[type="password"] { margin: 0; }
    button { width: 100%; margin: 3px 0; }
    table { font-size: 12px; }
    th, td { padding: 4px 6px; }
  }
</style>
</head>
<body>
  <h1>API Query & Export Excel</h1>

  <div class="box">
    <div class="field-row">
      <label for="server">Server URL</label>
      <div class="input-wrap">
        <input id="server" type="text" value="http://localhost:3000" autocomplete="off" spellcheck="false" />
      </div>
    </div>
    <div class="field-row">
      <label for="apiKey">API Key</label>
      <div class="input-wrap">
        <input id="apiKey" type="password" placeholder="Paste your account API key" autocomplete="off" spellcheck="false" />
        <span class="eye-toggle" id="toggleKey">Show</span>
      </div>
    </div>
    <div class="field-row">
      <label for="model">Model</label>
      <div class="input-wrap">
        <input id="model" type="text" placeholder="e.g. A-100 — leave empty for full list" autocomplete="off" spellcheck="false" />
      </div>
    </div>
    <div class="actions">
      <button class="btn-query"  id="queryBtn"  type="button">Query</button>
      <button class="btn-export" id="exportBtn" type="button">Export Excel</button>
    </div>
    <div id="status"></div>
    <div id="alertArea"></div>
    <h3>Query Results</h3>
    <table id="resultTable">
      <thead>
        <tr>
          <th>Model</th>
          <th>Price</th>
          <th>Condition</th>
          <th>Lead Time</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="4" class="empty-row">Click "Query" to load data</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    Endpoint: <code>GET {server}/api/model-prices</code> · Header: <code>x-api-key: &lt;key&gt;</code>
  </div>

<script>
(function () {
  "use strict";

  // 保存当前查询结果，供 Export Excel 使用
  var currentData = [];

  // ----- Elements -----
  var $ = function (id) { return document.getElementById(id); };
  var serverEl  = $("server"),  apiKeyEl = $("apiKey"), modelEl = $("model");
  var queryBtn  = $("queryBtn"), exportBtn = $("exportBtn"), toggleKey = $("toggleKey");
  var statusEl  = $("status"),  alertArea = $("alertArea");
  var resultBody = $("resultBody");

  // ----- Smart default Server URL -----
  // file:// 双击打开 → 保持默认 http://localhost:3000。
  // http(s) 打开时做同源探测（无 Key 请求 /api/model-prices）：
  //   401 → 同源即 API 服务器（Next / Vercel），直接用同源；
  //   404 → 同源只是静态预览服务器（如 2051 托管 public/，不转发 /api），
  //         回退为 主机名:3000（手机打开时 localhost 会指向手机自身，必须用 PC 的局域网地址）。
  // 用户手动改过 Server URL 则不覆盖。
  (function () {
    if (location.protocol === "file:") return;
    var touched = false;
    serverEl.addEventListener("input", function () { touched = true; });
    fetch(location.origin + "/api/model-prices").then(function (r) {
      if (touched) return;
      if (r.status === 401) {
        serverEl.value = location.origin;
      } else {
        serverEl.value = location.protocol + "//" + location.hostname + ":3000";
      }
    }).catch(function () { /* 探测失败保持默认值 */ });
  })();

  // ----- Helpers -----
  function trim(s) { return (s || "").trim(); }
  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function formatPrice(n) {
    if (n === null || n === undefined || isNaN(n)) return "";
    return Number(n).toFixed(2);
  }
  function clearAlerts() { alertArea.innerHTML = ""; }
  function showAlert(kind, label, message) {
    var div = document.createElement("div");
    div.className = "alert alert-" + kind;
    var html = "<b>" + escapeHtml(label) + "</b>";
    if (message) html += " " + escapeHtml(message);
    div.innerHTML = html;
    alertArea.appendChild(div);
  }

  function setLoading(isLoading) {
    queryBtn.disabled = isLoading;
    exportBtn.disabled = isLoading;
    if (isLoading) {
      queryBtn.innerHTML = '<span class="spinner"></span>Querying…';
    } else {
      queryBtn.textContent = "Query";
      // 导出按钮的可用状态取决于 currentData
      exportBtn.disabled = (!currentData || currentData.length === 0);
    }
  }

  function renderRows(rows) {
    if (!rows || rows.length === 0) {
      resultBody.innerHTML = '<tr><td colspan="4" class="empty-row">No data</td></tr>';
      return;
    }
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var model = escapeHtml(r.model || "");
      var price = formatPrice(r.price);
      var cond  = r.condition ? escapeHtml(r.condition) : '<span style="color:#999">—</span>';
      var lead  = r.leadTime ? escapeHtml(r.leadTime) : '<span style="color:#999">—</span>';
      html += '<tr>'
            + '<td>' + model + '</td>'
            + '<td class="price">' + price + '</td>'
            + '<td>' + cond + '</td>'
            + '<td>' + lead + '</td>'
            + '</tr>';
    }
    resultBody.innerHTML = html;
  }

  // ----- Show / hide API key -----
  toggleKey.addEventListener("click", function () {
    if (apiKeyEl.type === "password") {
      apiKeyEl.type = "text";
      toggleKey.textContent = "Hide";
    } else {
      apiKeyEl.type = "password";
      toggleKey.textContent = "Show";
    }
  });

  // ----- Enter to submit -----
  [serverEl, apiKeyEl, modelEl].forEach(function (el) {
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); runQuery(); }
    });
  });

  // ----- Query button -----
  queryBtn.addEventListener("click", runQuery);

  // ----- Export Excel button -----
  exportBtn.addEventListener("click", exportExcel);
  // 初始状态：无数据，禁用导出
  exportBtn.disabled = true;

  async function runQuery() {
    clearAlerts();

    var server = trim(serverEl.value).replace(/\/+$/, "");
    var apiKey = trim(apiKeyEl.value);
    var model  = trim(modelEl.value);

    // Validation
    if (!server) {
      showAlert("error", "Missing server URL.", "Enter the API server base URL (e.g. http://localhost:3000).");
      serverEl.focus(); return;
    }
    if (!/^https?:\/\//i.test(server)) {
      showAlert("error", "Invalid server URL.", "It must start with http:// or https://");
      serverEl.focus(); return;
    }
    if (!apiKey) {
      showAlert("error", "Missing API key.", "Paste your account API key to authenticate.");
      apiKeyEl.focus(); return;
    }

    // Build URL
    var url = server + "/api/model-prices?limit=100&offset=0";
    if (model) url += "&model=" + encodeURIComponent(model);

    setLoading(true);
    statusEl.textContent = "Querying…";
    resultBody.innerHTML = '<tr><td colspan="4" class="empty-row">Loading…</td></tr>';

    var started = performance.now();

    try {
      var res = await fetch(url, {
        method: "GET",
        headers: { "x-api-key": apiKey },
        mode: "cors"
      });

      var elapsed = Math.max(1, Math.round(performance.now() - started));
      var body;
      try {
        body = await res.json();
      } catch (jsonErr) {
        showAlert("error", "Bad response.", "Server returned non-JSON body (HTTP " + res.status + ").");
        statusEl.textContent = "";
        currentData = [];
        renderRows([]);
        return;
      }

      if (!res.ok || body.success === false) {
        var code = res.status;
        var msg = (body && body.error) ? body.error : "Request failed.";
        var label = code === 401 ? "401 Unauthorized"
                  : code === 403 ? "403 Forbidden"
                  : code === 404 ? "404 Not Found"
                  : code >= 500 ? "Server error"
                  : "Request error";
        showAlert(
          code === 401 || code === 403 ? "error" : (code >= 500 ? "warn" : "error"),
          label + " (HTTP " + code + ")", msg
        );
        statusEl.textContent = "";
        currentData = [];
        renderRows([]);
        return;
      }

      // Success
      var total  = Number(body.total)  || 0;
      var offset = Number(body.offset) || 0;
      var rows = Array.isArray(body.rows) ? body.rows : [];
      currentData = rows;

      var shownFrom = total === 0 ? 0 : (offset + 1);
      var shownTo = offset + rows.length;
      statusEl.innerHTML = "Total: <b>" + total + "</b> · Showing: <b>"
                         + (total === 0 ? "0" : shownFrom + "–" + shownTo) + "</b> · "
                         + rows.length + " rows · " + elapsed + " ms";

      renderRows(rows);

      if (rows.length === 0) {
        showAlert("warn", "No rows returned.", "The endpoint responded successfully but no prices match the current filter.");
      } else {
        showAlert("success", "Success.", rows.length + " row(s) returned. Click \"Export Excel\" to download.");
      }
    } catch (err) {
      var errMsg = (err && err.message) ? err.message : "Network request failed.";
      var hint = "";
      if (/failed to fetch|networkerror/i.test(errMsg)) {
        hint = " Check that the server is reachable and CORS allows this origin. If opening via file://, ensure the server is online and Access-Control-Allow-Origin is *.";
      }
      showAlert("error", "Network error.", errMsg + hint);
      statusEl.textContent = "";
      currentData = [];
      renderRows([]);
    } finally {
      setLoading(false);
    }
  }

  function exportExcel() {
    if (!currentData || currentData.length === 0) {
      showAlert("warn", "Nothing to export.", "Run a query first to load data.");
      return;
    }
    if (typeof XLSX === "undefined") {
      showAlert("error", "XLSX library not loaded.", "Check your internet connection — the xlsx CDN script failed to load.");
      return;
    }

    // 英文列名导出
    var exportRows = currentData.map(function (r) {
      return {
        "Model":        r.model || "",
        "Price (USD)":  (r.price !== null && r.price !== undefined) ? Number(r.price) : "",
        "Condition":    r.condition || "",
        "Lead Time":    r.leadTime || ""
      };
    });

    var ws = XLSX.utils.json_to_sheet(exportRows);
    // 列宽优化
    ws["!cols"] = [{ wch: 22 }, { wch: 14 }, { wch: 16 }, { wch: 18 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "API Prices");

    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
            + "_" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    var fileName = "api-prices_" + ts + ".xlsx";
    XLSX.writeFile(wb, fileName);

    showAlert("success", "Exported.", fileName + " (" + currentData.length + " rows) downloaded.");
  }

  // 初始焦点
  apiKeyEl.focus();
})();
</script>
</body>
</html>
