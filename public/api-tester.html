<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>API 测试工具 - 查询并导出Excel</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: "Microsoft YaHei", Arial, sans-serif; max-width: 1100px; margin: 30px auto; padding: 20px; background: #f8f9fa; }
    h1 { font-size: 22px; }
    .box { background: #fff; border: 1px solid #e0e0e0; padding: 20px; margin: 12px 0; border-radius: 8px; }
    label { display: inline-block; width: 120px; font-size: 14px; color: #333; }
    input[type="text"] { padding: 8px; margin: 4px; font-size: 14px; width: 380px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 9px 20px; margin: 5px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-query { background: #0070f3; color: #fff; }
    .btn-query:hover { background: #0051cc; }
    .btn-export { background: #16a34a; color: #fff; }
    .btn-export:hover { background: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f1f3f5; }
    .tip { color: #888; font-size: 13px; margin-top: 8px; }
    #status { color: #666; font-size: 13px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>API 查询测试 & 导出 Excel</h1>

  <div class="box">
    <label>API 地址：</label>
    <input type="text" id="apiUrl" value="http://localhost:3000/api/model-prices"><br>
    <label>API Key：</label>
    <input type="text" id="apiKey" value="你的API_KEY"><br>
    <label>型号（选填）：</label>
    <input type="text" id="model" placeholder="留空=拉取全部产品（分页），填型号=查单个"><br>
    <button class="btn-query" onclick="query()">查询</button>
    <button class="btn-export" onclick="exportExcel()">导出 Excel</button>
  </div>

  <div id="status"></div>

  <div class="box">
    <h3 style="margin-top:0">查询结果</h3>
    <table id="resultTable">
      <thead>
        <tr>
          <th>型号 Model</th>
          <th>单价 Price (USD)</th>
          <th>货况 Condition</th>
          <th>货期 Lead Time</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="4" style="text-align:center;color:#999">点击「查询」后显示数据</td></tr>
      </tbody>
    </table>
    <div class="tip">说明：导出Excel时，会把当前表格里的所有行下载为 .xlsx 文件。</div>
  </div>

  <script>
    let currentData = []; // 保存当前查询结果，用于导出

    async function query() {
      const url = document.getElementById('apiUrl').value.trim();
      const key = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('model').value.trim();
      const statusEl = document.getElementById('status');
      const body = document.getElementById('resultBody');

      statusEl.textContent = '查询中...';
      body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999">加载中...</td></tr>';

      try {
        if (model) {
          // 单型号查询
          const res = await fetch(`${url}?model=${encodeURIComponent(model)}&limit=100&offset=0`, {
            headers: { 'x-api-key': key }
          });
          const json = await res.json();
          currentData = json.rows || [];
        } else {
          // 分页全量拉取
          currentData = [];
          let offset = 0;
          const limit = 100;
          while (true) {
            statusEl.textContent = `分页拉取中... offset=${offset}`;
            const res = await fetch(`${url}?limit=${limit}&offset=${offset}`, {
              headers: { 'x-api-key': key }
            });
            const json = await res.json();
            const rows = json.rows || [];
            if (rows.length === 0) break;
            currentData = currentData.concat(rows);
            offset += limit;
          }
        }

        // 渲染表格
        if (currentData.length === 0) {
          body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999">未查询到数据</td></tr>';
          statusEl.textContent = '查询完成，共 0 条。';
        } else {
          body.innerHTML = currentData.map(r => `
            <tr>
              <td>${r.model ?? ''}</td>
              <td>${r.price ?? ''}</td>
              <td>${r.condition ?? ''}</td>
              <td>${r.leadTime ?? ''}</td>
            </tr>
          `).join('');
          statusEl.textContent = `查询完成，共 ${currentData.length} 条。`;
        }
      } catch (err) {
        statusEl.textContent = '请求出错: ' + err.message;
        body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red">请求失败</td></tr>';
      }
    }

    function exportExcel() {
      if (!currentData || currentData.length === 0) {
        alert('没有数据可导出，请先查询！');
        return;
      }
      // 整理成Excel列名
      const exportRows = currentData.map(r => ({
        '型号': r.model ?? '',
        '单价(USD)': r.price ?? '',
        '货况': r.condition ?? '',
        '货期': r.leadTime ?? ''
      }));
      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '产品报价库存');
      const now = new Date();
      const fileName = `产品报价库存_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`;
      XLSX.writeFile(wb, fileName);
    }
  </script>
</body>
</html>
